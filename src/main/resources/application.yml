spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/itinerario}
    username: ${DATABASE_USER:itinerario}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
